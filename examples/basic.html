<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarity — Basic example</title><link rel="stylesheet" href="../dist/clarity.css"><style>body{margin:0;padding:32px}main{max-width:720px;margin:auto}</style></head><body class="clarity"><main class="cl-stack"><p class="cl-eyebrow">YOUR NEXT PROJECT</p><h1>A clearer starting point.</h1><p class="cl-muted">This example works with local CSS and system fonts. No JavaScript or remote assets required.</p><section class="cl-card cl-card__body cl-stack"><h2>Project details</h2><form class="cl-stack" action="#saved"><label class="cl-field" for="name">Project name<input class="cl-input" name="name" id="name" required placeholder="Research workspace"></label><label class="cl-field" for="kind">Visibility<select class="cl-select" id="kind" name="kind"><option>Private</option><option>Team</option></select></label><div class="cl-row"><button class="cl-btn cl-btn--primary" type="submit">Submit example form</button><button class="cl-btn cl-btn--secondary" type="reset">Reset</button><span class="cl-badge cl-badge--info">Draft</span></div></form></section><p class="cl-help" id="saved">This is a native GET form demonstration; it does not save data.</p></main></body></html>
